services:
  - type: web
    name: viraclip-ai-v7
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TRANSCRIBE_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_SELECTION_INPUT_CHARS
        value: 16000
      - key: UPLOAD_CHUNK_BYTES
        value: 2097152
      - key: NODE_OPTIONS
        value: --require=./groq-shim.js --require=./selection-fix.js --require=./render-http-shim.js --require=./chunk-upload-shim.js
      - key: META_GRAPH_API_VERSION
        value: v24.0
      - key: COOKIE_SECURE
        value: true
      - key: ENABLE_YOUTUBE_IMPORT
        value: false
